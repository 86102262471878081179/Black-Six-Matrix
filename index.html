":\"Dieser Chat kann nicht geteilt werden\",\"1BrKhL\":\"Chat teilen\",\"2soqCE\":\"Link löschen\",\"3PvhRS\":\"Link löschen\",\"3HojkJ\":\"Alle Personen, die den ursprünglichen Link haben, können sich die Unterhaltung nicht mehr ansehen.\",\"3TB7DT\":\"Overflow-Menü öffnen\",\"3OKI2J\":\"Mehr Conversation Starters ansehen\",\"S3ONi\":\"Vorige Conversation Starters anzeigen\",\"2vXXFC\":\"Marketplace durchsuchen\",\"mBjev\":\"Hilf mir, coole Artikel im Facebook Marketplace zu finden, die in meiner Gegend im Trend liegen.\",\"1fKa93\":\"Fasse meine E-Mails zusammen\",\"1mic7\":\"Lies mein E-Mail-Postfach/meinen Kalender und fasse meine Aufgaben für die kommende Woche auf ansprechende Art und Weise zusammen. Gruppiere sie nach Bereichen und verwende einen klaren Aufzählungspunkt pro Aufgabe. Konzentriere dich dabei speziell auf mein E-Mail-Postfach. Liste nicht alle meine Kalendereinträge auf, sondern hebe nur die Aufgaben hervor, die ich erledigen sollte. Berücksichtige das aktuelle Datum und die Uhrzeit, verweise nicht auf vergangene Ereignisse. Beeil dich beim Zusammenstellen! Wenn ich mein E-Mail-Postfach oder meinen Kalender noch nicht verknüpft habe, hilf mir bitte zuerst dabei.\",\"3svUgO\":\"Stelle eine Capsule Wardrobe zusammen\",\"1waFPd\":\"Identifiziere basierend auf meinen Instagram-Aktivitäten die Ästhetik, die ich bevorzuge, und erstelle eine Capsule Wardrobe, die ich kaufen und tragen kann und die meinem persönlichen Stil entspricht.\",\"4hmJwY\":\"Lese überfällige E-Mails\",\"22XUhH\":\"Lies meine E-Mails und meinen Kalender und gib mir eine Zusammenfassung der Dinge, auf die ich noch antworten muss.\",\"4t6DiH\":\"Erstelle einen proteinreichen Mahlzeitenplan\",\"3irSnu\":\"Teile einen 5-tägigen proteinreichen Mahlzeitenplan, der auf Instagram, Facebook und Threads beliebt ist, damit ich ihn für die nächste Woche vorbereiten kann. Zeige mir für jedes Rezept die schrittweise Anweisungen zur Zubereitung. Wähle die Rezepte aus und erstelle dann ein visuelles und ansprechendes Artefakt des Mahlzeitenplans, bei dem alle Inhalte klar aufgeführt sind, und füge die entsprechenden Social-Media-Beiträge auf ansprechende Weise ein, um die Rezepte zu ergänzen. Antworte mit einer kurzen Zusammenfassung des Artefakts.\",\"1K5yTM\":\"Ein saisonales Sommergericht zubereiten\",\"3M6BtD\":\"Erstelle ein topaktuelles Rezept mit saisonalen und lokalen Zutaten. Verwandle das Rezept in ein interaktives Artefakt mit Ersatzzutaten und Medien.\",\"3VY2zN\":\"Plane ein koreanisches BBQ\",\"170syz\":\"Erstelle ein detailreiches und ansprechendes Artefakt, das mir Schritt für Schritt erklärt, wie ich ein traditionelles koreanisches BBQ-Dinner zu Hause zubereite.\",\"3SCT3N\":\"Erstelle einen personalisierten Interessenguide\",\"2lPGTe\":\"Erstelle ein ausführliches visuelles Dokument mit einem 10-tägigen Lernplan mit Quizfragen zu einem Thema, das mich interessieren könnte\",\"3QPefy\":\"Plane einen perfekten Samstag\",\"4xHM83\":\"Ich habe an diesem Samstag frei. Aktiviere 3 Sub-Agenten und gib mir 3 Optionen: etwas im Freien, etwas Kulturelles und etwas Gemütliches – alles in meiner Nähe. Sieh nach, was dieses Wochenende in meiner Umgebung angesagt und los ist. Füge Content ein, um mir meine Optionen zu zeigen.\",\"1grHMR\":\"Erstelle einen Laufplan für Anfänger\",\"3kWxPB\":\"Ich möchte anfangen, Laufen zu gehen, habe aber keine Erfahrung. Verwende Subagenten, um mir einen Couch-to-5K-Plan und Tipps zu geben, wie ich nach der ersten Woche nicht aufgebe.\",\"2C99tr\":\"Finde einfache 20-Minuten-Abendessen\",\"1FbnXx\":\"Aktiviere 3 Unteragenten, um 3 einfache 20-Minuten-Abendessen zu finden, die auf Instagram im Trend liegen – eines vegetarisch, eines mit Huhn und eines mit Nudeln.\",\"4iUIVD\":\"Vergleiche alle sauberen Energiearten\",\"XgbM9\":\"Erläutere mir die Energiequellen Solarenergie, Windenergie, Wasserkraft, Kernenergie und Geothermie. Aktiviere Subagenten, um zu erklären, wie die Quelle in Strom umgewandelt wird. Erstelle eine übersichtliche Infografik und ein paar Diagramme.\",\"4zbgkA\":\"Erstelle ein Lookbook für mich\",\"4B4RrG\":\"Stelle für mich basierend auf meinem Instagram-Geschmack ein Lookbook mit aufstrebenden Marken zusammen, die ich gerne tragen würde. Suche Teile heraus, die ich tatsächlich kaufen kann, und erzähl mir etwas über sie. Gib jedem Look eine eigene Seite, auf der die Teile wie auf einem Outfit-Board angeordnet sind, damit ich sehen kann, wie sie zusammen aussehen. Füge eine kurze Notiz zum Vibe und zu den Reels hinzu, um ein visuell ansprechendes Erlebnis zu schaffen. Es soll sich wie eine Zeitschrift anfühlen, durch die ich blättern kann.\",\"44DStf\":\"Verwandle Notizen in einen Lernleitfaden\",\"2TehQh\":\"Ich sende dir ein Bild von meinen handschriftlichen Notizen. Transkribiere sie und erstelle ein interaktives Artefakt, das nach Themen geordnet ist und Quizfragen enthält, um mein Wissen zu überprüfen.\",\"2Pjmv8\":\"Fasse meine Termine und E-Mails zusammen\",\"2iqhus\":\"Lies mein E-Mail-Postfach und meinen Kalender und fasse meine Aufgaben für die kommende Woche auf ansprechende Art und Weise zusammen. Gruppiere sie nach Bereichen und verwende einen klaren Aufzählungspunkt pro Aufgabe. Konzentriere dich dabei speziell auf mein E-Mail-Postfach. Liste nicht alle meine Kalendereinträge auf, sondern hebe nur die Aufgaben hervor, die ich erledigen sollte. Berücksichtige das aktuelle Datum und die Uhrzeit, verweise nicht auf vergangene Ereignisse. Beeil dich beim Zusammenstellen! Wenn ich mein E-Mail-Postfach oder meinen Kalender noch nicht verknüpft habe, hilf mir bitte zuerst dabei. Frage mich nach dem Zusammenstellen, ob ich dies zu einer täglich geplanten Aufgabe machen möchte.\",\"2gJBxQ\":\"Erstelle ein tägliches 20-Minuten-Workout\",\"B8bS6\":\"Richte eine tägliche Aufgabe für 6 Uhr ein. Stelle mir jeden Morgen ein 20-minütiges Workout ohne Geräte für zu Hause zusammen, wobei die Muskelgruppen durchwechseln, sodass sich die Übungen im Laufe der Woche ändern und aufeinander aufbauen. Sag mir, worauf der Fokus am jeweiligen Tag liegt und wie schwierig es sich anfühlen sollte. Füge zu jeder Übung ein klares Bild, eine Anleitung in einfacher Sprache mit einer Form oder einem Sicherheitshinweis sowie Wiederholungen oder Pausen ein. Füge ein kurzes Aufwärmen und Abkühlen hinzu und gib eine leichtere und eine schwerere Option. Die Gesamtdauer sollte etwa 20 Minuten betragen. Starte das Workout jetzt zusätzlich zum Erstellen der Aufgabe.\",\"40T1xV\":\"Prüfe meine kostenpflichtigen Abos\",\"lUoUD\":\"Sieh dir alle meine aktiven Abos an und sag mir, was tatsächlich nützlich ist und was nicht\",\"3313JX\":\"Abbrechen\",\"1e4tcX\":\"Wird gespeichert …\",\"12ivny\":\"Speichern\",\"2t8NYQ\":\"Artefakt konnte nicht geladen werden\",\"1bMraI\":\"Noch einmal versuchen\",\"liKwW\":\"Artefakt bearbeiten\",\"X156V\":\"Schließen\",\"4p9XU0\":\"Artefakt wird geladen …\",\"1fPZ8M\":\"Quelle für Artefakt konnte nicht geladen werden\",\"2W6zUF\":\"Artefaktquelle\",\"1QYnVS\":\"Abbrechen\",\"1E8bx8\":\"Wird gespeichert …\",\"3xeP1z\":\"Speichern\",\"1PaIX5\":\"Download\",\"4wWKQ9\":\"Bearbeiten\",\"53ktQ\":\"Debugging-Informationen [nur intern]\",\"573ov\":\"Quelle wird geladen …\",\"1aR4oK\":\"Quelle konnte nicht geladen werden\",\"2S5AtR\":\"Vorschau\",\"1OcVwF\":\"Code\",\"1T0Qb7\":\"Vorschau aktualisieren\",\"2C8HHB\":\"Vollbild\",\"17t2Dw\":\"Vorschau schließen\",\"7rl9x\":\"Herunterladen\",\"3eLzaW\":\"HTML-Vorschau\",\"PZ3Ep\":\"Artefakt wird geladen …\",\"2US6In\":\"Vorschau des Artefakts\",\"4bQEnY\":\"Vorschau nicht verfügbar\",\"412PTR\":\"Vorschau des Artefakts\",\"Ae5dh\":\"Vorschau des Artefakt-Thumbnails\",\"QCkK6\":\"Dieses Reel kann hier nicht abgespielt werden. Es ist möglicherweise privat, gelöscht oder nicht verfügbar.\",\"37fP8M\":\"Vorschau des Artefakts\",\"1nEII4\":\"Quellcode verbergen\",\"1Ih1jh\":\"Quellcode ansehen\",\"4AhETP\":\"Vorschau öffnen\",\"2MUOtj\":\"Bearbeiten\",\"3ceaR1\":\"Artefakt herunterladen\"
