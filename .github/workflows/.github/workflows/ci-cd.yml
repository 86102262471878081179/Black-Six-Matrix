name: "OMNI-CORE CI/CD Pipeline"

# Die Pipeline triggert bei jedem Push auf den Hauptzweig oder bei Pull Requests
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ============================================================
  # JOB 1: CODE VALIDIERUNG & TEST
  # ============================================================
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: "Code auschecken"
        uses: actions/checkout@v4

      - name: "Go Umgebung einrichten"
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true # Aktiviert automatisches Caching für blitzschnelle Builds

      - name: "Abhängigkeiten installieren"
        run: |
          go mod download
          go mod tidy

      - name: "Code Formatierung prüfen (Linter)"
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Fehler: Go-Code ist nicht sauber formatiert! Bitte 'gofmt' ausführen."
            exit 1
          fi

      - name: "Kompilierung prüfen"
        run: |
          go build -v ./cmd/omni-proxy/...

  # ============================================================
  # JOB 2: DOCKER IMAGE VERIFIKATION
  # ============================================================
  docker-build-check:
    needs: validate-and-test # Startet erst, wenn die Go-Prüfungen erfolgreich waren
    runs-on: ubuntu-latest
    steps:
      - name: "Code auschecken"
        uses: actions/checkout@v4

      - name: "Docker Buildx einrichten"
        uses: docker/setup-buildx-action@v3

      - name: "Multi-Stage Docker Image bauen"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false # Nur bauen, um die Integrität der Dockerfile zu testen
          tags: omni-core-v20:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
